<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1116" />
    <meta name="description" content="TRINITY - an integrated athlete performance platform connecting nutrition, recovery, training and daily activity." />
    <title>TRINITY - Fuel. Recover. Perform.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the stored/automatic theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('trinity.theme') || 'auto';
          var h = new Date().getHours();
          var resolved = pref === 'auto' ? (h >= 6 && h < 18 ? 'day' : 'night') : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* keep the default */ }
      })();
    </script>
      <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRINITY" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
