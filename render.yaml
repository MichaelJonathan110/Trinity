databases:
  - name: trinity-db
    plan: free
    databaseName: trinity
    user: trinity

services:
  - type: web
    name: trinity-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      # Render generates a strong value; never commit a real one.
      - key: SECRET_KEY
        generateValue: true
      # Render hands out 'postgresql://...'; app/core/config.py rewrites the
      # scheme to 'postgresql+psycopg://' so the psycopg3 driver is used.
      - key: DATABASE_URL
        fromDatabase:
          name: trinity-db
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      # Set in the Render dashboard to your Vercel URL (comma-separated for
      # several), e.g. https://trinity.vercel.app
      - key: CORS_ORIGINS
        sync: false
